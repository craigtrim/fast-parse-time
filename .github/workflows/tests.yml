name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Run complete suite
        run: python -m pytest -q

  wheel:
    name: Installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the built wheel
        run: python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel) + '[test]'])"
      - name: Test outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from pathlib import Path; import fast_parse_time; assert 'site-packages' in Path(fast_parse_time.__file__).parts, fast_parse_time.__file__"
          python -m pytest "$GITHUB_WORKSPACE/tests" -c "$GITHUB_WORKSPACE/pyproject.toml" -q
